name: ci

on:
  push:
    branches: [master]
  pull_request:

# Core compile gate. The full unit suite (388 tests) links QUIC (ngtcp2 +
# OpenSSL 3.5 QUIC-TLS) and the WebRTC engine (path dependency ../d-webrtc-v3),
# a heavier toolchain built locally and exercised on the two-NAT rig; this gate
# compiles the core library (no WebRTC, no QUIC) so a break in the common code
# is caught on every push.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev libc-ares-dev

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Compile the core library
        run: dub build -c library-no-webrtc --compiler=ldc2
