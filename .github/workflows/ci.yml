name: CI

# Two checks, both of which do the real thing or fail. The gate runs the suite
# and also fails on a crash, a leaked eventcore handle, or a task still running
# at exit. The interop run talks to a real rust-libp2p node in both directions,
# which is the only check that can catch a shared misreading of the protocol.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - name: install libsodium and openssl
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev
      - name: run the gate
        run: ./tools/run-tests.sh

  interop:
    name: interop with rust-libp2p
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: interop/rust-peer
      - name: install libsodium and openssl
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev
      - name: both directions
        run: ./interop/run-interop.sh
