name: ci

on:
  push:
    branches: [master]
  pull_request:

# Runs the bulk of the unit suite (~389 tests). The QUIC handshake tests are
# excluded here (ut-no-quic drops the Libp2pQuic version) because ngtcp2 +
# OpenSSL 3.5 QUIC-TLS is a heavier toolchain built locally and exercised on the
# two-NAT rig; everything else — TCP, Noise, yamux/mplex, swarm, identify, kad,
# relay/DCUtR orchestration, mDNS, WebRTC — runs on every push. The WebRTC
# engine is a path dependency (../d-webrtc-v3), cloned as a sibling below.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev libc-ares-dev

      - name: Fetch the WebRTC engine (path dependency ../d-webrtc-v3)
        run: git clone --depth 1 --branch v3 https://github.com/caetanus/d-webrtc.git ../d-webrtc-v3

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Build + run the unit suite (QUIC excluded)
        run: |
          dub build -c ut-no-quic --compiler=ldc2
          ./bin/libp2p-test-noquic
